name: Build .exe

# Jeder Push auf main baut die .exe. Ist die Versionsnummer (APP_VERSION) neu,
# legt GitHub den Tag v<Version> an und erstellt ein Release mit der .exe.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version lesen
        id: ver
        shell: bash
        run: |
          v=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' swv_live_ranking.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $v"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten
        run: pip install pyserial pyinstaller xlrd openpyxl
      - name: Build
        run: pyinstaller --onefile --windowed --name SWV_LiveRanking --hidden-import xlrd --hidden-import openpyxl swv_live_ranking.py
      - uses: actions/upload-artifact@v4
        with:
          name: SWV_LiveRanking-${{ steps.ver.outputs.version }}
          path: dist/SWV_LiveRanking.exe
      - name: Release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.version }}
          files: dist/SWV_LiveRanking.exe
          generate_release_notes: true
