name: Build .exe

# Jeder Push auf main baut die .exe und den Installer. Ist die Versionsnummer (APP_VERSION) neu,
# legt GitHub den Tag v<Version> an und erstellt ein Release mit Installer und .exe.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version lesen
        id: ver
        shell: bash
        run: |
          v=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' swv_live_ranking.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $v"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten
        run: pip install pyserial pyinstaller xlrd openpyxl pillow
      - name: Build
        run: |
          python tools/make_version_file.py version_info.txt
          pyinstaller --onefile --windowed --name SWV_LiveRanking --version-file version_info.txt --hidden-import xlrd --hidden-import openpyxl --hidden-import PIL.ImageGrab swv_live_ranking.py
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\swv_live_ranking.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: SWV_LiveRanking-${{ steps.ver.outputs.version }}
          path: |
            dist/SWV_LiveRanking.exe
            dist/SWV_LiveRanking_Setup_${{ steps.ver.outputs.version }}.exe
      - name: Release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.version }}
          files: |
            dist/SWV_LiveRanking_Setup_${{ steps.ver.outputs.version }}.exe
            dist/SWV_LiveRanking.exe
          generate_release_notes: true
